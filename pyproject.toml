# 项目元数据和运行时依赖。
[project]
name = "learning-agent"
version = "0.1.0"
description = "A PDF-grounded adaptive teaching agent built with smolagents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pymupdf>=1.24,<2",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "smolagents[openai]>=1.22,<3",
  "uvicorn[standard]>=0.30,<1",
]

# 测试、静态检查等本地开发工具。
[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]

# 使用 setuptools 构建可安装的 Python 包。
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# 测试和代码质量工具的统一配置。
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

