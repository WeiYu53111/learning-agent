# Shared project defaults. Keep credentials in environment variables, never here.
active_backend = "local_codex"

[backends.local_codex]
type = "codex_cli"
executable = "codex"
auth = "existing_login"
timeout_seconds = 600
input_chars = 96000
model = "gpt-6-astra"
# Without model, Codex uses its built-in default, not the user's config.toml.

[backends.remote_api]
type = "openai_compatible"
base_url = "https://api.openai.com/v1"
model = "your-model"
api_key_env = "TEACH_API_KEY"
timeout_seconds = 180

[backends.offline_demo]
type = "demo"
